<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Naxçıvan Turizm Portalı</title>
    <!-- Android & iOS Mobile Web App Fullscreen Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B1528" />
    <!-- Link Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-navy-deep antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register PWA Service Worker for Android Standalone Installer -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('PWA Service Worker registered successfully!', reg.scope);
            })
            .catch(err => {
              console.error('PWA Service Worker registration failure:', err);
            });
        });
      }
    </script>
  </body>
</html>
